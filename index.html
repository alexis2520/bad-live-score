.nmb{text-decoration:underline dotted;cursor:pointer}

const ST={t:'s',title:'',first:0,n:[['','' ],['','']],cl:['',''],col:[PAL[0],PAL[1]]};
function setup(){clear();$app.replaceChildren();const p=el('div','page');p.append(el('h2','t','Nouveau match'));
 const c0=el('div','card');c0.append(el('label',null,'Titre de la rencontre (facultatif)'));
 const ti=el('input');ti.type='text';ti.placeholder='Ex. Finale du tournoi';ti.value=ST.title;ti.maxLength=50;ti.oninput=()=>ST.title=ti.value;c0.append(ti);
 c0.append(el('label',null,'Type de match'));const sg=el('div','seg');
 [['s','Simple'],['d','Double']].forEach(([v,l])=>{const b=el('button',ST.t===v?'on':'',l);b.onclick=()=>{ST.t=v;setup()};sg.append(b)});c0.append(sg);p.append(c0);
 [0,1].forEach(k=>{const cd=el('div','card');const hd=el('b',null,'Équipe '+(k+1));cd.append(hd);
  const np=ST.t==='d'?2:1;for(let j=0;j<np;j++){cd.append(el('label',null,np>1?'Joueur '+(j+1):'Joueur'));const n=el('input');n.type='text';n.placeholder='Nom';n.maxLength=20;n.value=ST.n[k][j]||'';n.oninput=()=>ST.n[k][j]=n.value;cd.append(n)}
  cd.append(el('label',null,'Club (facultatif)'));const c=el('input');c.type='text';c.placeholder='Club';c.maxLength=30;c.value=ST.cl[k];c.oninput=()=>ST.cl[k]=c.value;cd.append(c);
  cd.append(el('label',null,'Couleur'));const sw=el('div','sw');PAL.forEach(col=>{const b=el('button',col===ST.col[k]?'on':'');b.style.background=col;b.onclick=()=>{ST.col[k]=col;[...sw.children].forEach(x=>x.classList.toggle('on',x===b))};sw.append(b)});cd.append(sw);p.append(cd)});
 p.append(el('div','sub','L’équipe 1 sert en premier (le joueur 1 en double).'));
 const bk=el('button','btn','Retour');bk.onclick=home;const go=el('button','btn pri','Lancer le match');
 go.onclick=async()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];
  const np=ST.t==='d'?2:1;const pl=[0,1].map(k=>{const a=[];for(let j=0;j<np;j++)a.push((ST.n[k][j]||'').trim()||('Joueur '+(k*np+j+1)));return a});
  const M={t:ST.t,title:ST.title.trim(),first:ST.first,pl,cl:ST.cl.map(x=>x.trim()),col:ST.col.slice(),log:[''],t0:Date.now()};
  mpath='matches/'+c;M.owner=uid;
  if(db){try{await db.doc(mpath).set(M)}catch(e){alert('Création impossible. Réessaie.');return}}
  S=M;openMatch(c,true)};
 const r=el('div','row');r.append(bk,go);p.append(r);$app.append(p)}

function openMatch(c,scorer){clear();fsk=0;code=c;canScore=scorer;feed=[];prev=null;
 if(db){unsubs.push(db.doc(mpath).onSnapshot(s=>{if(!s.exists||canScore)return;const d=s.data();onUpdate(d);S=d;render()}));
  unsubs.push(db.collection('matches/'+c+'/items').orderBy('t','desc').limit(60).onSnapshot(q=>{if(fsk)q.docChanges().forEach(c=>{if(c.type==='added'){const d=c.doc.data();if(d.k==='react'&&Date.now()-d.t<15000)floatEmoji(d.x)}});fsk=1;feed=q.docs.map(d=>d.data());render()}))}
 if(S)prev=snap(S);render();const iv=setInterval(()=>{if(!S)return;document.querySelectorAll('.clk').forEach(e=>e.textContent=fmt(S))},1000);unsubs.push(()=>clearInterval(iv))}
function onUpdate(d){if(canScore){prev=snap(d);return}const n=snap(d);if(prev){if(n.o&&!prev.o)vib([200,100,200,100,200]);else if(n.s>prev.s)vib([200,100,200]);else if(n.p>prev.p)vib(120)}prev=n}

function push(l,up,fx){const old=snap(S),o1=S.t1;S={...S,log:l,fx:fx||S.fx||[],t1:null};const n=snap(S);if(n.o)S.t1=(old.o&&o1)?o1:Date.now();
 if(up){if(n.o&&!old.o)vib([200,100,200,100,200]);else if(n.s>old.s)vib([200,100,200]);else vib(120)}
 prev=n;render();if(db)db.doc(mpath).update({log:l,fx:S.fx||[],t1:S.t1||null}).catch(()=>{})}
function rotate(k){const si=S.log.length-1;push(S.log.slice(),false,[...(S.fx||[]),{s:si,i:S.log[si].length,k}])}
function add(team){if(calc(S).over)return;const l=S.log.slice();l[l.length-1]+=team;const nc=calc({...S,log:l});if(nc.sets[l.length-1].done&&!nc.over)l.push('');push(l,true)}
function undo(){const l=S.log.slice();const fx=(S.fx||[]).slice(),si=l.length-1;
 const fi=fx.map(f=>f.s===si&&f.i===l[si].length).lastIndexOf(true);if(fi>=0){fx.splice(fi,1);push(l,false,fx);return}
 if(!l[l.length-1]&&l.length>1)l.pop();const s=l[l.length-1];if(!s)return;l[l.length-1]=s.slice(0,-1);push(l,false)}

function render(){if(!S)return;const c=calc(S);const root=el('div','m');
 const top=el('div','top');if(S.title)top.append(el('div','ttl',S.title));
 const cd=el('div','cd',(S.t==='d'?'Double':'Simple')+' · Code ');cd.append(el('b',null,code),document.createTextNode(' · '),el('span','clk',fmt(S)));top.append(cd);
 const bar=el('div','bar');
 [['home','Sortir',home],['stats','Stats',statsSheet],['sliders','Réglages',settingsSheet],['bet','Parier',betSheet],['chat','Réactions',reactSheet]].forEach(([i,t,f])=>{const b=el('button');b.setAttribute('aria-label',t);b.append(icon(i,22));b.onclick=f;bar.append(b)});top.append(bar);
 const sc=el('div','score');
 [0,1].forEach(k=>{const p=el('div','panel');p.style.backgroundColor=S.col[k];p.style.color=txt(S.col[k]);
  const pn=el('div','pn');S.pl[k].forEach((n,j)=>{const sv=!c.over&&c.cur.s===k&&c.cur.p===j;const d=el('div','pl'+(sv?' sv':''));if(sv)d.append(icon('serve',10));d.append(el('span',null,n));pn.append(d)});if(S.cl[k])pn.append(el('div','cl',S.cl[k]));
  const mid=el('div');mid.style.textAlign='center';mid.append(el('div','pt',String(k?c.cur.b:c.cur.a)),el('div','sd',!c.over&&c.cur.s===k?'Service à '+c.cur.side:''));
  const dots=el('div','dots');[0,1].forEach(i=>dots.append(el('i',c.w[k]>i?'f':'')));
  p.append(pn,mid,dots);
  if(canScore){p.onclick=()=>add(k);if(S.t==='d'){const r=el('button','rot');r.setAttribute('aria-label','Changer le serveur');r.append(icon('rotate',22));r.onclick=e=>{e.stopPropagation();rotate(k)};p.append(r)}}
  sc.append(p)});
 if(canScore){const u=el('button','undo');u.setAttribute('aria-label','Annuler le dernier point');u.append(icon('undo',24));u.onclick=undo;sc.append(u)}
 root.append(top,sc);
 if(canScore)root.append(el('div','hint','Touche un côté pour marquer · la flèche annule le dernier point'));
 if(c.over){const w=el('div','win');w.append(icon('trophy',20),el('span',null,'Victoire de '+tn(S,c.w[0]>c.w[1]?0:1)));root.append(w)}
 const ch=el('div','chips');c.sets.forEach((x,i)=>{if(x.a+x.b>0)ch.append(el('span','chip','Set '+(i+1)+' : '+x.a+'–'+x.b))});root.append(ch);
 const f=el('div','feed');const fl=feed.filter(x=>x.k!=='react');if(!fl.length)f.append(el('div','empty','Les commentaires apparaîtront ici.'));
 fl.forEach(x=>{const d=el('div','fi');
  if(x.k==='react'){if(IC[x.x]){const b=el('span','rb');b.append(icon(x.x,18));d.append(b)}else d.append(el('span','em',x.x));d.append(el('i',null,x.n||'Anonyme'))}
  else if(x.k==='bet'){const b=el('span','rb');b.append(icon('bet',16));d.append(b,el('i',null,(x.n||'Anonyme')+' mise sur '+tn(S,x.team)))}
  else{const nb=el('b','nmb',x.n||'Anonyme');nb.onclick=()=>openSheet(x.n||'Anonyme',sh=>{const w=el('div');w.style.textAlign='center';w.append(avatar(x.a,x.n,'avb'));const q=el('p','sub','Club : '+(x.c||'Pas de club'));q.style.textAlign='center';sh.append(w,q)});
  d.append(avatar(x.a,x.n,'ca'),nb,document.createTextNode('  '),el('span',null,x.x))}
  f.append(d)});root.append(f);
 $app.replaceChildren(root)}

function closeSheet(){const o=document.querySelector('.sheetbg');if(o)o.remove()}
function openSheet(title,build){closeSheet();const bg=el('div','sheetbg');const s=el('div','sheet');s.append(el('h3',null,title));build(s);
 const x=el('button','btn','Fermer');x.style.cssText='width:100%;margin-top:14px';x.onclick=closeSheet;s.append(x);bg.append(s);bg.onclick=e=>{if(e.target===bg)closeSheet()};document.body.append(bg)}
function addFeed(o){const d={...o,n:cfg.name||'Anonyme',c:cfg.club||'',u:cfg.dev,t:Date.now()};if(o.k==='comment'&&cfg.av)d.a=cfg.av;if(db)db.collection('matches/'+code+'/items').add(d).catch(()=>{});else{if(d.k==='react')floatEmoji(d.x);feed=[d,...feed];render()}}

function reactSheet(){openSheet('Réactions',s=>{const g=el('div','emo');REACTS.forEach(r=>{const b=el('button',null,r);b.style.cssText='padding:12px 0;font-size:30px';b.onclick=()=>{addFeed({k:'react',x:r});vib(30);closeSheet()};g.append(b)});
 const i=el('input');i.type='text';i.placeholder='Écrire un commentaire…';i.maxLength=140;i.style.margin='14px 0 8px';
 const sd=el('button','btn pri','Envoyer');sd.style.width='100%';sd.onclick=()=>{const v=i.value.trim();if(!v)return;addFeed({k:'comment',x:v});closeSheet()};s.append(g,i,sd)})}

function betSheet(){openSheet('Parier pour le fun',s=>{s.append(el('p','sub','Aucun enjeu, juste pour s’amuser. Un pari par personne, modifiable.'));
 const m=new Map();[...feed].reverse().forEach(x=>{if(x.k==='bet')m.set(x.u,x.team)});let a=0,b=0;m.forEach(v=>v===0?a++:b++);const t=a+b,pa=t?Math.round(a/t*100):50;
 const bar=el('div','bet');const x=el('div');x.style.cssText='width:'+pa+'%;background:'+S.col[0];const y=el('div');y.style.cssText='flex:1;background:'+S.col[1];bar.append(x,y);
 s.append(bar,el('div','sub',tn(S,0)+' '+pa+'% · '+tn(S,1)+' '+(t?100-pa:50)+'% ('+t+' pari'+(t>1?'s':'')+')'));
 const mine=m.get(cfg.dev);[0,1].forEach(k=>{const bt=el('button','btn');bt.style.cssText='width:100%;margin:6px 0;border-left:10px solid '+S.col[k]+';display:flex;align-items:center;justify-content:center;gap:8px';if(mine===k)bt.append(icon('check',18));bt.append(el('span',null,'Parier sur '+tn(S,k)));bt.onclick=()=>{addFeed({k:'bet',team:k});closeSheet()};s.append(bt)})})}

function settingsSheet(){openSheet('Réglages',s=>{
 const r=el('div','tg');const l=el('div');l.append(el('b',null,'Vibration à chaque point'),el('small',null,'2 vibrations en fin de set, 3 en fin de match'));
 const t=el('button','tgb'+(cfg.vib?' on':''));t.onclick=()=>{cfg.vib=!cfg.vib;store('vib',cfg.vib?'1':'0');t.classList.toggle('on',cfg.vib);vib(120)};r.append(l,t);
 s.append(r);const bx=el('div');s.append(bx);profileForm(bx)})}

function statsSheet(){openSheet('Stats du match',s=>{const c=calc(S);
 const all=S.log.join('');const best=[0,0],lead=[0,0];let last=null,run=0;
 S.log.forEach(l=>{let a=0,b=0;for(const ch of l){const k=+ch;k?b++:a++;run=(k===last)?run+1:1;last=k;if(run>best[k])best[k]=run;if(a-b>lead[0])lead[0]=a-b;if(b-a>lead[1])lead[1]=b-a}});
 const sum=[0,1].map(k=>[...all].filter(x=>+x===k).length);
 const tb=el('table');const hd=el('tr');['',tn(S,0),tn(S,1)].forEach(v=>{const h=el('th',null,v);h.style.fontSize='12px';hd.append(h)});tb.append(hd);
 [['Points totaux',sum[0],sum[1]],['Sets gagnés',c.w[0],c.w[1]],['Plus longue série',best[0],best[1]],['Plus grosse avance',lead[0],lead[1]]].forEach(r=>{const tr=el('tr');r.forEach(v=>tr.append(el('td',null,String(v))));tb.append(tr)});
 s.append(tb,el('p','sub','Durée : '+fmt(S)+' · '+all.length+' points joués'));
 const ns='http://www.w3.org/2000/svg';const mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e};
 S.log.forEach((l,si)=>{if(l.length<1)return;const A=[0],B=[0];for(const ch of l){A.push(A[A.length-1]+(ch==='0'));B.push(B[B.length-1]+(ch==='1'))}
  const n=l.length,mx=Math.max(15,A[n],B[n]),W=300,H=150,L=22,R=8,T=8,Bt=18;const X=i=>L+i/Math.max(n,1)*(W-L-R),Y=v=>H-Bt-v/mx*(H-Bt-T);
  const box=el('div','cht');box.append(el('b',null,'Set '+(si+1)+' · '+A[n]+'–'+B[n]));
  const lg=el('div','lg');[0,1].forEach(k=>{const d=el('span');const i=el('i');i.style.background=S.col[k];d.append(i,document.createTextNode(tn(S,k)));lg.append(d)});box.append(lg);
  const sv=mk('svg',{viewBox:'0 0 '+W+' '+H});sv.style.width='100%';
  for(let v=0;v<=mx;v+=5){sv.append(mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:'#8884','stroke-width':1}));const t=mk('text',{x:L-4,y:Y(v)+4,'text-anchor':'end','font-size':10,fill:'#888'});t.textContent=v;sv.append(t)}
  const tx=mk('text',{x:W-R,y:H-4,'text-anchor':'end','font-size':10,fill:'#888'});tx.textContent='échanges →';sv.append(tx);
  [[A,0],[B,1]].forEach(([arr,k])=>{sv.append(mk('polyline',{points:arr.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' '),fill:'none',stroke:S.col[k],'stroke-width':3,'stroke-linejoin':'round','stroke-linecap':'round'}));sv.append(mk('circle',{cx:X(n),cy:Y(arr[n]),r:4,fill:S.col[k]}))});
  box.append(sv);s.append(box)})})}

init();
</script></body></html>
